[project]
name = "druggability"
version = "0.0.1"
description = "ESM3-based small-molecule druggability scoring"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "biopython>=1.83",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "esm>=3.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
